<!doctype html>

<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NDIICAM</title>
<style>
  :root {
    --fondo: #f4f5f7; --panel: #ffffff; --borde: #e3e6ea; --texto: #16191d;
    --suave: #626a75; --acento: #2563eb; --acento-t: #ffffff;
    --ok: #15803d; --ok-f: #dcfce7; --aviso: #b45309; --aviso-f: #fef3c7;
    --mal: #b91c1c; --mal-f: #fee2e2; --pista: #e8ebef; --sombra: 0 1px 2px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #0e1013; --panel: #171a1f; --borde: #262b32; --texto: #e8eaed;
      --suave: #98a1ad; --acento: #4f8cff; --acento-t: #0b1220;
      --ok: #4ade80; --ok-f: #11291a; --aviso: #fbbf24; --aviso-f: #2d230c;
      --mal: #f87171; --mal-f: #301416; --pista: #252a31; --sombra: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--texto);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif;
    -webkit-font-smoothing: antialiased; }
  .envoltura { max-width: 980px; margin: 0 auto; padding: 16px 16px 48px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .marca { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: .02em; }
  .marca small { color: var(--suave); font-weight: 500; font-size: 13px; letter-spacing: 0; }
  .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--acento);
    display: grid; place-items: center; color: var(--acento-t); }
  .cabecera-dcha { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .idioma { display: inline-flex; border: 1px solid var(--borde); border-radius: 8px; overflow: hidden; }
  .idioma button { border: 0; background: none; color: var(--suave); font: inherit; font-size: 12.5px;
    font-weight: 650; padding: 4px 9px; cursor: pointer; }
  .idioma button.activo { background: var(--pista); color: var(--texto); }
  .pastilla { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px;
    border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--pista); color: var(--suave); }
  .pastilla::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .pastilla.ok { background: var(--ok-f); color: var(--ok); }
  .pastilla.aviso { background: var(--aviso-f); color: var(--aviso); }
  .pastilla.mal { background: var(--mal-f); color: var(--mal); }
  .pastilla.vivo::before { animation: latido 1.6s ease-in-out infinite; }
  @keyframes latido { 50% { opacity: .35; } }
  .tarjeta { background: var(--panel); border: 1px solid var(--borde); border-radius: 14px;
    padding: 16px; box-shadow: var(--sombra); }
  .tarjeta h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--suave); margin: 0 0 12px; font-weight: 650; }
  .tarjeta h3 { font-size: 16px; margin: 0; font-weight: 650; }
  .rejilla { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); margin-top: 12px; }
  .heroe { display: grid; gap: 16px; grid-template-columns: 1fr auto; align-items: center; }
  .heroe .estado { font-size: 28px; font-weight: 700; letter-spacing: -.01em; }
  .heroe .sub { color: var(--suave); margin-top: 2px; word-break: break-word; }
  .cifras { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; grid-column: 1 / -1; }
  .cifra { background: var(--fondo); border-radius: 10px; padding: 10px 12px; min-width: 0; }
  .cifra b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cifra span { color: var(--suave); font-size: 12.5px; }
  .graficas { display: flex; gap: 12px; }
  .grafica { text-align: right; font-size: 12px; color: var(--suave); }
  .grafica svg { display: block; width: 130px; height: 38px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; margin: 0; }
  dt { color: var(--suave); }
  dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; word-break: break-word; }
  .barra { height: 6px; border-radius: 3px; background: var(--pista); overflow: hidden; margin: 6px 0 2px; }
  .barra i { display: block; height: 100%; width: 0; border-radius: 3px; background: var(--acento); transition: width .5s; }
  .barra.ok i { background: var(--ok); } .barra.aviso i { background: var(--aviso); } .barra.mal i { background: var(--mal); }
  .linea-barra { margin-bottom: 10px; }
  .linea-barra .rotulo { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; }
  .linea-barra .rotulo span:first-child { color: var(--suave); }
  .aviso-ap { border-color: var(--acento); margin-bottom: 12px; }
  .aviso-ap p { margin: 4px 0 0; color: var(--suave); }
  .seccion { margin-top: 12px; }
  label { display: block; font-size: 13.5px; color: var(--suave); margin: 0 0 6px; }
  .ayuda { font-size: 12.5px; color: var(--suave); margin-top: 5px; }
  input[type=text], input[type=password], input[type=number], select { width: 100%; padding: 10px 12px; font: inherit; color: var(--texto);
    background: var(--fondo); border: 1px solid var(--borde); border-radius: 10px; outline: none; }
  input:focus, select:focus { border-color: var(--acento); }
  input:disabled, select:disabled { opacity: .5; }
  .segmentado { display: inline-flex; flex-wrap: wrap; background: var(--fondo); border: 1px solid var(--borde); border-radius: 10px; padding: 3px; }
  .segmentado button { border: 0; background: none; color: var(--texto); font: inherit; font-weight: 600;
    padding: 7px 14px; border-radius: 7px; cursor: pointer; }
  .segmentado button.activo { background: var(--acento); color: var(--acento-t); }
  .segmentado button:disabled { opacity: .35; cursor: not-allowed; }
  .campos { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .botones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
  .boton { border: 1px solid var(--borde); background: var(--panel); color: var(--texto); font: inherit;
    font-weight: 600; padding: 9px 14px; border-radius: 10px; cursor: pointer; text-decoration: none; display: inline-block; }
  .boton.principal { background: var(--acento); border-color: var(--acento); color: var(--acento-t); }
  .boton.peligro { color: var(--mal); }
  .boton:disabled { opacity: .5; cursor: progress; }
  .lista { list-style: none; margin: 0; padding: 0; }
  .lista li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--borde); }
  .lista li:first-child { border-top: 0; }
  .lista .nombre { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lista .meta { color: var(--suave); font-size: 12.5px; }
  .red-boton { all: unset; display: flex; align-items: center; gap: 10px; width: 100%; cursor: pointer; }
  .senal { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; }
  .senal i { width: 3px; background: var(--pista); border-radius: 1px; }
  .senal i.on { background: var(--texto); }
  .formulario-red { display: flex; gap: 8px; padding: 0 0 10px; }
  .formulario-red input { flex: 1; }
  .mensaje { margin-top: 10px; padding: 10px 12px; border-radius: 10px; font-size: 14px; }
  .mensaje.ok { background: var(--ok-f); color: var(--ok); }
  .mensaje.mal { background: var(--mal-f); color: var(--mal); }
  .mensaje.info { background: var(--pista); color: var(--texto); }
  .eventos li { font-size: 13.5px; }
  .eventos time { color: var(--suave); font-variant-numeric: tabular-nums; min-width: 64px; }
  .vacio { color: var(--suave); font-size: 14px; padding: 6px 0; }
  .oculto { display: none !important; }
  .desconectado { position: fixed; left: 16px; right: 16px; bottom: 16px; max-width: 520px; margin: 0 auto;
    background: var(--mal); color: #fff; padding: 12px 16px; border-radius: 12px; font-weight: 600; text-align: center; }
  footer { margin-top: 20px; color: var(--suave); font-size: 12.5px; text-align: center; }
  .fuente { margin-top: 12px; }
  .fuente-cab { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .fuente-cab .sub { color: var(--suave); font-size: 13px; }
  .fuente-cab .pastilla { margin-left: auto; }
  .fuente-cuerpo { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
  .conmutador { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600; }
  .conmutador input { appearance: none; width: 38px; height: 22px; border-radius: 11px; background: var(--pista); position: relative; margin: 0; cursor: pointer; transition: background .2s; }
  .conmutador input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .2s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .conmutador input:checked { background: var(--ok); }
  .conmutador input:checked::after { left: 19px; }
  .punto { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--pista); margin-right: 6px; }
  .punto.ok { background: var(--ok); } .punto.mal { background: var(--mal); } .punto.aviso { background: var(--aviso); }
  @media (max-width: 640px) {
    .heroe { grid-template-columns: 1fr; }
    .graficas { justify-content: space-between; gap: 10px; }
    .grafica { text-align: left; flex: 1; min-width: 0; }
    .grafica svg { width: 100%; }
    .cifras { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .heroe .estado { font-size: 24px; }
    .fuente-cuerpo { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="envoltura">
  <header>
    <div class="marca">
      <div class="logo" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 10l5-3v10l-5-3z"/><rect x="3" y="6" width="12" height="12" rx="2"/></svg>
      </div>
      <div>NDIICAM <small id="equipo"></small></div>
    </div>
    <div class="cabecera-dcha">
      <span class="pastilla" id="pastilla">…</span>
      <div class="idioma"><button data-lang="es">ES</button><button data-lang="en">EN</button></div>
    </div>
  </header>

  <section class="tarjeta aviso-ap oculto" id="avisoAp">
    <strong data-t="ap_banner_t"></strong>
    <p data-t="ap_banner_p"></p>
  </section>

  <section class="tarjeta heroe">
    <div>
      <div class="estado" id="estado">—</div>
      <div class="sub" id="estadoSub">—</div>
    </div>
    <div class="graficas">
      <div class="grafica"><svg id="grafTx" viewBox="0 0 130 38" preserveAspectRatio="none"></svg><span data-t="traffic"></span></div>
      <div class="grafica"><svg id="grafCpu" viewBox="0 0 130 38" preserveAspectRatio="none"></svg><span data-t="cpu_pct"></span></div>
      <div class="grafica" id="bloqueGrafW"><svg id="grafW" viewBox="0 0 130 38" preserveAspectRatio="none"></svg><span data-t="power_w"></span></div>
    </div>
    <div class="cifras">
      <div class="cifra"><b id="cFuentes">—</b><span data-t="sources"></span></div>
      <div class="cifra"><b id="cRecep">—</b><span data-t="receivers"></span></div>
      <div class="cifra"><b id="cTx">—</b><span data-t="mbit_out"></span></div>
      <div class="cifra"><b id="cCpu">—</b><span data-t="cpu"></span></div>
    </div>
  </section>

  <div id="fuentes"></div>

  <section class="tarjeta seccion" id="secHdmi">
    <div class="fuente-cab">
      <div><h3 data-t="hdmi_title"></h3><div class="sub" id="hdmiSub"></div></div>
      <label class="conmutador" style="margin-left:auto"><input type="checkbox" id="hdmiActiva"><span data-t="hdmi_on"></span></label>
    </div>
    <div class="campos">
      <div id="bloqueHdmiFuente">
        <label for="hdmiFuente" data-t="hdmi_camera"></label>
        <select id="hdmiFuente"></select>
      </div>
      <div><label data-t="hdmi_state"></label><div id="hdmiEstado">—</div></div>
      <div>
        <label for="hdmiConsola" data-t="hdmi_screen_res"></label>
        <select id="hdmiConsola">
          <option value="nativa" data-t="hdmi_res_native"></option>
          <option value="1080p">1920×1080</option>
          <option value="720p">1280×720</option>
        </select>
        <div class="ayuda" data-t="hdmi_res_help"></div>
      </div>
    </div>
    <div class="mensaje aviso oculto" id="hdmiReinicio" style="background:var(--aviso-f);color:var(--aviso)">
      <span data-t="hdmi_reboot_needed"></span>
      <button class="boton" id="btHdmiReboot" style="margin-left:8px" data-t="reboot_now"></button>
    </div>
    <div class="ayuda" data-t="hdmi_help" style="margin-top:10px"></div>
    <div class="mensaje oculto" id="msgHdmi"></div>
  </section>

  <div class="rejilla">
    <section class="tarjeta">
      <h2 data-t="network"></h2>
      <div class="linea-barra">
        <div class="rotulo"><span id="redTitulo"></span><span id="redSenal">—</span></div>
        <div class="barra" id="barraSenal"><i></i></div>
      </div>
      <div class="linea-barra">
        <div class="rotulo"><span data-t="link_use"></span><span id="redUso">—</span></div>
        <div class="barra" id="barraUso"><i></i></div>
      </div>
      <dl>
        <dt data-t="connection"></dt><dd id="redModo">—</dd>
        <dt data-t="band"></dt><dd id="redBanda">—</dd>
        <dt data-t="link_speed"></dt><dd id="redEnlace">—</dd>
        <dt data-t="ip"></dt><dd id="redIp">—</dd>
        <dt data-t="transport"></dt><dd id="ndiTransporte">—</dd>
      </dl>
    </section>

    <section class="tarjeta">
      <h2 data-t="device"></h2>
      <div class="linea-barra">
        <div class="rotulo"><span data-t="cpu"></span><span id="eqCpu">—</span></div>
        <div class="barra" id="barraCpu"><i></i></div>
      </div>
      <div class="linea-barra">
        <div class="rotulo"><span data-t="memory"></span><span id="eqRam">—</span></div>
        <div class="barra" id="barraRam"><i></i></div>
      </div>
      <dl>
        <dt data-t="power"></dt><dd id="eqPotencia">—</dd>
        <dt data-t="temperature"></dt><dd id="eqTemp">—</dd>
        <dt data-t="uptime"></dt><dd id="eqUptime">—</dd>
      </dl>
    </section>

    <section class="tarjeta">
      <h2 data-t="updates"></h2>
      <dl>
        <dt data-t="installed_version"></dt><dd id="actActual">—</dd>
        <dt data-t="latest_version"></dt><dd id="actUltima">—</dd>
        <dt data-t="checked"></dt><dd id="actComprobado">—</dd>
      </dl>
      <div class="botones">
        <button class="boton" id="btComprobar" data-t="check_updates"></button>
        <button class="boton principal oculto" id="btActualizar"></button>
        <a class="boton oculto" id="actNotas" target="_blank" rel="noopener" data-t="release_notes"></a>
      </div>
      <div class="mensaje oculto" id="msgAct"></div>
    </section>
  </div>

  <section class="tarjeta seccion" id="secWifi">
    <h2 data-t="wifi_networks"></h2>
    <label data-t="saved_help"></label>
    <ul class="lista" id="wifiGuardadas"></ul>
    <div class="botones" style="margin-top:6px">
      <button class="boton" id="btBuscar" data-t="scan"></button>
    </div>
    <div class="ayuda oculto" id="ayudaCache" data-t="scan_cached"></div>
    <ul class="lista oculto" id="wifiVistas" style="margin-top:10px"></ul>
    <div class="mensaje oculto" id="msgWifi"></div>
  </section>

  <section class="tarjeta seccion" id="secIp">
    <h2 data-t="ip_address"></h2>
    <div class="ayuda" id="ipPerfil" style="margin:0 0 12px"></div>
    <div class="segmentado" id="segIp">
      <button type="button" data-v="auto" data-t="ip_auto"></button>
      <button type="button" data-v="manual" data-t="ip_manual"></button>
    </div>
    <div class="campos" style="margin-top:14px">
      <div><label for="ipDir" data-t="ip_addr"></label><input type="text" id="ipDir" inputmode="decimal" placeholder="192.168.1.50"></div>
      <div><label for="ipPref" data-t="ip_prefix"></label><input type="number" id="ipPref" min="8" max="30" placeholder="24"></div>
      <div><label for="ipGw" data-t="ip_gateway"></label><input type="text" id="ipGw" inputmode="decimal" placeholder="192.168.1.1"></div>
      <div><label for="ipDns" data-t="ip_dns"></label><input type="text" id="ipDns" placeholder="192.168.1.1, 1.1.1.1"></div>
    </div>
    <div class="botones">
      <button class="boton principal" id="btIp" data-t="apply"></button>
    </div>
    <div class="mensaje oculto" id="msgIp"></div>
  </section>

  <section class="tarjeta seccion">
    <h2 data-t="device_settings"></h2>
    <div class="campos">
      <div>
        <label for="inEquipo" data-t="device_name"></label>
        <input type="text" id="inEquipo" maxlength="32" autocomplete="off" spellcheck="false">
        <div class="ayuda" data-t="device_name_help"></div>
      </div>
      <div>
        <label data-t="transport"></label>
        <div class="segmentado" id="segTransp">
          <button type="button" data-v="tcp">TCP</button>
          <button type="button" data-v="udp">UDP</button>
        </div>
        <div class="ayuda" data-t="transport_help"></div>
      </div>
      <div>
        <label for="inApSsid" data-t="ap_name"></label>
        <input type="text" id="inApSsid" maxlength="32" autocomplete="off" spellcheck="false">
      </div>
      <div>
        <label for="inApClave" data-t="ap_password"></label>
        <input type="text" id="inApClave" maxlength="63" autocomplete="off" spellcheck="false">
      </div>
      <div>
        <label for="inPais" data-t="country"></label>
        <input type="text" id="inPais" maxlength="2" autocomplete="off" spellcheck="false">
      </div>
      <div>
        <label for="inClavePanel" data-t="panel_password"></label>
        <input type="password" id="inClavePanel" maxlength="64" autocomplete="new-password">
        <div class="ayuda" id="ayudaClavePanel"></div>
        <button type="button" class="boton peligro oculto" id="btQuitarClave" style="margin-top:8px" data-t="remove_password"></button>
      </div>
    </div>
    <div class="botones">
      <button class="boton principal" id="btGuardarEquipo" data-t="save"></button>
    </div>
    <div class="mensaje oculto" id="msgEquipo"></div>

    <h2 style="margin-top:20px" data-t="backup"></h2>
    <div class="botones" style="margin-top:0">
      <a class="boton" href="/api/respaldo" download data-t="download_backup"></a>
      <button class="boton" id="btRestaurar" data-t="restore_backup"></button>
      <input type="file" id="archivoRespaldo" accept="application/json,.json" class="oculto">
      <button class="boton peligro" id="btFabrica" data-t="factory_reset"></button>
    </div>
    <div class="ayuda" data-t="backup_help"></div>
    <div class="mensaje oculto" id="msgRespaldo"></div>

    <h2 style="margin-top:20px" data-t="setup_wifi"></h2>
    <div class="ayuda" id="apEstado" style="margin:0 0 10px"></div>
    <div class="botones" style="margin-top:0">
      <button class="boton" id="btAp"></button>
      <button class="boton peligro" id="btReboot" data-t="reboot"></button>
    </div>
  </section>

  <section class="tarjeta seccion">
    <h2 data-t="activity"></h2>
    <ul class="lista eventos" id="eventos"></ul>
  </section>

  <footer>NDIICAM <span id="version"></span> · GPL-3.0 · NDI® is a registered trademark of Vizrt NDI AB</footer>
</div>
<div class="desconectado oculto" id="desconectado" data-t="disconnected"></div>

<script>
"use strict";
// ---------------------------------------------------------------- textos
const T = {
  es: {
    hdmi_title: "Salida HDMI", hdmi_on: "Mostrar", hdmi_camera: "Cámara en pantalla", hdmi_state: "Estado",
    hdmi_help: "Muestra la imagen de una cámara en el monitor conectado al equipo, para encuadrar. No consume CPU. Activarla o cambiar de cámara corta su NDI unos 2 s.",
    hdmi_no_monitor: "No hay ningún monitor conectado", hdmi_monitor: (p) => `Monitor en ${p.conector} (${p.modo || "?"})`,
    hdmi_showing: (n) => `Mostrando ${n}`, hdmi_off_state: "Apagada", hdmi_waiting: "Esperando a la cámara…",
    hdmi_failed: "La salida falló: la emisión sigue sin ella. Desactívala y vuelve a activarla para reintentar.",
    hdmi_auto: "Automática (la primera activa)",
    hdmi_screen_res: "Resolución de la pantalla", hdmi_res_native: "Nativa del monitor",
    hdmi_res_help: "Ponla igual que la de la cámara para verla a pantalla completa sin gastar CPU. Se aplica al reiniciar el equipo.",
    hdmi_reboot_needed: "Hay que reiniciar el equipo para aplicar la resolución de la pantalla.", reboot_now: "Reiniciar ahora",

function poner(id, texto) { const el = typeof id === "string" ? $(id) : id; el.textContent = texto ?? "—"; }
function barra(id, pct, clase) {
  const b = $(id); b.className = "barra " + (clase || "");
  b.firstElementChild.style.width = Math.max(0, Math.min(100, pct || 0)) + "%";
}
function duracion(seg) {
  if (seg == null) return "—";
  seg = Math.floor(seg);
  const d = Math.floor(seg / 86400), h = Math.floor(seg % 86400 / 3600), m = Math.floor(seg % 3600 / 60);
  if (d) return `${d} d ${h} h`;
  if (h) return `${h} h ${m} min`;
  if (m) return `${m} min`;
  return `${seg} s`;
}
function hora(ts) {
  return new Date(ts * 1000).toLocaleTimeString(lang, { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}
function banda(b) { return b === "5" ? "5 GHz" : lang === "es" ? "2,4 GHz" : "2.4 GHz"; }
function grafica(id, datos, max) {
  const svg = $(id), n = 60, w = 130, h = 38;
  max = Math.max(max, ...datos, 1);
  const pts = datos.map((v, i) => `${(w * (n - datos.length + i) / (n - 1)).toFixed(1)},${(h - 2 - (h - 4) * v / max).toFixed(1)}`);
  svg.innerHTML = pts.length > 1
    ? `<polyline points="${pts.join(" ")}" fill="none" stroke="var(--acento)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`
    : "";
}
function senalSvg(pct) {
  const s = document.createElement("span"); s.className = "senal";
  [25, 50, 75, 100].forEach((umbral, i) => {
    const b = document.createElement("i"); b.style.height = (4 + i * 3) + "px";
    if (pct >= umbral - 12) b.className = "on";
    s.appendChild(b);

  return s;
}
function mensaje(el, texto, clase) {
  const m = typeof el === "string" ? $(el) : el;

  m.className = "mensaje " + clase; m.textContent = texto;
}
function textoError(codigo) { return T[lang].errors[codigo] || codigo; }
function vacio(ul, texto) {

}
async function api(ruta, datos) {
  const op = datos === undefined ? {} :
    { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(datos) };
  const r = await fetch(ruta, op);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(textoError(j.error || "HTTP " + r.status));
  return j;
}
function el(tag, attrs, ...hijos) {

function segmentadoEn(cont, valores, actual, deshabilitados, alElegir) {

    b.classList.toggle("activo", b.dataset.v === String(actual));
    b.disabled = (deshabilitados || []).includes(b.dataset.v);

}
function rellenar(input, valor, clave) {

}

const CLASES = { emitiendo: "ok", iniciando: "aviso", sin_camara: "aviso", error: "mal", desactivada: "" };

  } });
  c.raiz = el("section", { class: "tarjeta fuente" },
    el("div", { class: "fuente-cab" },
      el("div", null, el("h3", { text: f.camara }), c.sub = el("div", { class: "sub" })),
      c.pastilla),
    el("div", { class: "fuente-cuerpo" },
      el("dl", null,
        el("dt", { text: t("ndi_name_net") }), c.ndi = el("dd"),
        el("dt", { text: t("mode") }), c.modo = el("dd"),
        el("dt", { text: t("cam_fps") }), c.fps = el("dd"),

        el("dt", { text: t("dropped") }), c.desc = el("dd"),
        el("dt", { text: t("audio") }), c.audio = el("dd"),

          oninput: () => editado.add(k("nombre")) }),

          } })),
        c.msg = el("div", { class: "mensaje oculto" }))));
  segmentadoEn(c.segRes, ["720p", "1080p"], null, [], (v) => { elegido[k("res")] = v; pintar(ultimo); });

function pintarFuente(c, f, e) {
  const id = f.id, k = (campo) => `${id}|${campo}`, aj = f.ajustes;
  c.pastilla.className = "pastilla " + (CLASES[f.estado] || "") + (f.estado === "emitiendo" ? " vivo" : "");
  poner(c.pastilla, t("st_" + f.estado));
  poner(c.sub, f.estado === "error" ? (T[lang].stream_errors[f.error] || f.error) : f.dispositivo);
  poner(c.ndi, f.nombre_ndi);
  poner(c.modo, f.modo ? `${f.modo.replace(" @", " · ")} · ${f.formato}` : "—");
  const activo = f.estado === "emitiendo";
  poner(c.fps, activo ? `${f.fps_camara.toFixed(1)} / ${f.fps_enviados.toFixed(1)}` : "—");
  poner(c.mbps, activo ? `${f.mbps_camara.toFixed(1)} Mbit/s` : "—");
  poner(c.desc, activo ? (f.descartes ? `${f.descartes} ${t("in_last_2s")}` : t("none")) : "—");

  if (aj.audio === "off") audio = t("audio_off_state");
  else if (f.audio.fallido) audio = t("audio_failed");
  else if (f.audio.dispositivo) audio = (f.audio.activo ? t("audio_on") : t("audio_waiting")) + " · " + f.audio.dispositivo;
  else if (aj.audio === "auto" && !f.audio.disponible) audio = t("audio_none");

  poner(c.recep, f.receptores.length ? f.receptores.map((r) => r.nombre || r.ip).join(", ") : t("nobody_now"));
  poner(c.desde, f.desde ? duracion(Date.now() / 1000 - f.desde) : "—");
  // ajustes, sin pisar lo que se está editando
  if (document.activeElement !== c.conmutador) c.conmutador.checked = aj.activa;
  rellenar(c.nombre, aj.ndi_nombre, k("nombre"));
  const noAdmite = Object.keys(f.admite).filter((r) => !f.admite[r]);
  segmentadoEn(c.segRes, null, elegido[k("res")] || aj.resolucion, noAdmite);
  const fpsLista = f.fps_disponibles.length ? f.fps_disponibles : [aj.fps];
  segmentadoEn(c.segFps, fpsLista, elegido[k("fps")] || aj.fps, [], (v) => { elegido[k("fps")] = v; pintar(ultimo); });
  if (!editado.has(k("audio")) && document.activeElement !== c.selAudio) {
    c.selAudio.replaceChildren(new Option(t("audio_auto"), "auto"), new Option(t("audio_off"), "off"),
      ...(e.audio_dispositivos || []).map((a) => new Option(a.nombre, a.id)));
    c.selAudio.value = aj.audio;
    if (c.selAudio.value !== aj.audio) c.selAudio.value = "auto";

}

function pintarFuentes(e) {
  const cont = $("fuentes"), fuentes = e.fuentes || [];
  const ids = new Set(fuentes.map((f) => f.id));
  tarjetas.forEach((c, id) => { if (!ids.has(id)) { c.raiz.remove(); tarjetas.delete(id); } });
  fuentes.forEach((f) => {
    let c = tarjetas.get(f.id);
    if (!c) { c = crearTarjeta(f); tarjetas.set(f.id, c); cont.appendChild(c.raiz); }
    pintarFuente(c, f, e);
  });
  let vac = cont.querySelector(".vacio-fuentes");
  if (!fuentes.length && !vac) {
    cont.appendChild(el("section", { class: "tarjeta fuente vacio-fuentes" }, el("div", { class: "vacio", text: t("sub_sin_camara") })));
  } else if (fuentes.length && vac) vac.remove();
}

function pintarHdmi(e) {
  const h = e.hdmi || {}, fuentes = e.fuentes || [];
  const monitor = (h.pantallas || []).find((p) => p.conectado);
  poner("hdmiSub", monitor ? T[lang].hdmi_monitor(monitor) : t("hdmi_no_monitor"));
  if (document.activeElement !== $("hdmiActiva")) $("hdmiActiva").checked = !!h.activa;
  $("bloqueHdmiFuente").classList.toggle("oculto", fuentes.length < 2);
  if (document.activeElement !== $("hdmiFuente")) {
    $("hdmiFuente").replaceChildren(new Option(t("hdmi_auto"), "auto"), ...fuentes.map((f) => new Option(f.camara, f.id)));
    $("hdmiFuente").value = h.fuente || "auto";
    if (!$("hdmiFuente").value) $("hdmiFuente").value = "auto";
  }
  const fuente = fuentes.find((f) => f.id === h.mostrando);
  let estado = t("hdmi_off_state");

  else if (h.activa && fuente) estado = fuente.hdmi && fuente.estado === "emitiendo" ? T[lang].hdmi_showing(fuente.camara) : t("hdmi_waiting");
  else if (h.activa) estado = t("hdmi_waiting");

  if (document.activeElement !== $("hdmiConsola")) $("hdmiConsola").value = h.consola || "nativa";

// ----------------------------------------------------------------- pintar
function pintar(e) {
  ultimo = e;
  const em = e.emision || {}, red = e.red || {}, eq = e.equipo || {}, cfg = e.config || {}, fuentes = e.fuentes || [];
  const texto = t("st_" + em.estado);
  $("pastilla").className = "pastilla " + (CLASES[em.estado] || "") + (em.estado === "emitiendo" ? " vivo" : "");
  poner("pastilla", texto);
  poner("equipo", eq.nombre ? eq.nombre.toUpperCase() : "");
  poner("version", e.version ? "v" + e.version : "");
  poner("estado", texto);
  let sub = "";
  if (em.estado === "sin_camara") sub = t("sub_sin_camara");
  else if (em.estado === "desactivada") sub = t("sub_desactivada");
  else sub = T[lang].sub_emitiendo(fuentes.filter((f) => f.ajustes.activa).length,
    fuentes.filter((f) => f.nombre_ndi).map((f) => f.nombre_ndi));
  poner("estadoSub", sub);
  poner("cFuentes", `${em.emitiendo ?? 0} / ${fuentes.length}`);
  poner("cRecep", String(em.receptores ?? 0));
  poner("cTx", red.tx_mbps != null ? red.tx_mbps.toFixed(1) : "—");
  poner("cCpu", eq.cpu != null ? eq.cpu + "%" : "—");

  historial.tx.push(red.tx_mbps || 0); historial.cpu.push(eq.cpu || 0); historial.w.push(eq.potencia_w || 0);
  for (const k in historial) if (historial[k].length > 60) historial[k].shift();
  grafica("grafTx", historial.tx, 20); grafica("grafCpu", historial.cpu, 100); grafica("grafW", historial.w, 2);
  $("bloqueGrafW").classList.toggle("oculto", eq.potencia_w == null);

  pintarFuentes(e);
  pintarHdmi(e);

  // red
  const w = red.wifi;
  if (red.modo === "ethernet") {
    poner("redTitulo", t("cable"));
    poner("redSenal", red.ethernet.velocidad ? red.ethernet.velocidad + " Mbit/s" : t("connected"));
    barra("barraSenal", 100, "ok");
  } else if (w) {
    poner("redTitulo", t("wifi_signal"));
    poner("redSenal", `${w.senal_pct}% · ${w.senal_dbm} dBm`);
    barra("barraSenal", w.senal_pct, w.senal_pct >= 60 ? "ok" : w.senal_pct >= 35 ? "aviso" : "mal");
  } else {
    poner("redTitulo", t("wifi_signal")); poner("redSenal", t("no_connection")); barra("barraSenal", 0, "mal");
  }
  if (red.capacidad_mbps) {
    const uso = 100 * red.tx_mbps / red.capacidad_mbps;
    poner("redUso", `${red.tx_mbps.toFixed(0)} ${t("of")} ~${red.capacidad_mbps} Mbit/s`);
    barra("barraUso", uso, uso < 50 ? "ok" : uso < 80 ? "aviso" : "mal");
  } else { poner("redUso", "—"); barra("barraUso", 0); }
  poner("redModo", red.modo === "ethernet" ? t("cable") : red.modo === "wifi" ? `WiFi «${w.ssid}»` : t("no_network"));
  poner("redBanda", red.modo === "wifi" ? `${banda(w.banda)} · ${t("channel")} ${w.canal}` : "—");
  poner("redEnlace", red.modo === "wifi" && w.tx_mbit ? `${w.tx_mbit} Mbit/s` :
    red.modo === "ethernet" && red.ethernet.velocidad ? `${red.ethernet.velocidad} Mbit/s` : "—");
  poner("redIp", red.modo === "ethernet" ? red.ethernet.ip : w ? w.ip : "—");
  poner("ndiTransporte", (cfg.transporte || "").toUpperCase());

  // equipo
  poner("eqCpu", `${eq.cpu}% · ${eq.nucleos} ${t("cores")}`);
  barra("barraCpu", eq.cpu, eq.cpu < 70 ? "ok" : eq.cpu < 90 ? "aviso" : "mal");
  poner("eqRam", eq.ram_pct + "%"); barra("barraRam", eq.ram_pct, eq.ram_pct < 80 ? "ok" : "aviso");
  poner("eqPotencia", eq.potencia_w != null ? T[lang].power_value(eq.potencia_w, eq.potencia_nucleos_w) : "—");
  poner("eqTemp", eq.temp != null ? eq.temp + " °C" : "—");
  poner("eqUptime", duracion(eq.uptime));

  // actualización
  const a = e.actualizacion || {};
  poner("actActual", a.actual ? "v" + a.actual : "—");
  poner("actUltima", a.ultima || (a.error ? (T[lang].update_errors[a.error] || a.error) : "—"));
  poner("actComprobado", a.comprobado ? T[lang].ago(duracion(Date.now() / 1000 - a.comprobado)) : t("never"));
  $("btActualizar").classList.toggle("oculto", !a.disponible || a.en_curso);
  poner("btActualizar", a.ultima ? T[lang].install_update(a.ultima) : "");
  $("actNotas").classList.toggle("oculto", !a.url);
  if (a.url) $("actNotas").href = a.url;
  if (a.en_curso) mensaje("msgAct", t("updating"), "info");

  // IP
  const ip = red.ip;
  $("secIp").querySelectorAll("input, #segIp button, #btIp").forEach((x) => { x.disabled = !ip; });
  if (ip) {
    poner("ipPerfil", T[lang].ip_profile(ip.perfil, ip.dispositivo));
    const metodo = elegido.ip_metodo || ip.metodo;
    segmentadoEn($("segIp"), null, metodo, []);
    const origen = ip.metodo === "manual" ? ip : ip.en_uso;
    rellenar($("ipDir"), origen.direccion, "ipDir"); rellenar($("ipPref"), origen.prefijo, "ipPref");
    rellenar($("ipGw"), origen.gateway, "ipGw"); rellenar($("ipDns"), (origen.dns || []).join(", "), "ipDns");
    ["ipDir", "ipPref", "ipGw", "ipDns"].forEach((x) => { $(x).disabled = metodo !== "manual"; });
  } else poner("ipPerfil", t("ip_none"));

  // ajustes del equipo
  rellenar($("inEquipo"), eq.nombre, "inEquipo");
  segmentadoEn($("segTransp"), null, elegido.transporte || cfg.transporte, []);
  rellenar($("inApSsid"), cfg.ap_ssid, "inApSsid");
  rellenar($("inApClave"), cfg.ap_clave, "inApClave");
  rellenar($("inPais"), cfg.pais, "inPais");
  poner("ayudaClavePanel", cfg.clave_panel ? t("panel_pw_on") : t("panel_pw_off"));
  $("btQuitarClave").classList.toggle("oculto", !cfg.clave_panel);

  // WiFi de configuración
  const ap = red.ap || {};
  poner("apEstado", !red.tiene_wifi ? t("ap_no_wifi") : ap.activo ? T[lang].ap_active(ap) : t("ap_idle"));
  $("btAp").classList.toggle("oculto", !red.tiene_wifi);
  poner("btAp", ap.forzado_hasta ? t("ap_off") : t("ap_on"));
  $("btAp").dataset.activar = ap.forzado_hasta ? "" : "1";
  $("secWifi").classList.toggle("oculto", !red.tiene_wifi);
  $("avisoAp").classList.toggle("oculto", !e.desde_ap);
  // desde la WiFi de configuración, lo primero es elegir red
  if (e.desde_ap && $("avisoAp").nextElementSibling !== $("secWifi")) $("avisoAp").after($("secWifi"));

  // actividad
  const ev = $("eventos"); ev.replaceChildren();
  (e.eventos || []).slice(0, 15).forEach((x) => {
    const f = T[lang].ev[x.c];
    ev.appendChild(el("li", null, el("time", { text: hora(x.t) }),
      el("span", { class: "nombre", style: "white-space:normal", text: f ? f(x.d || {}) : x.c })));
  });
}

async function refrescar() {
  try {
    pintar(await api("/api/estado"));
    $("desconectado").classList.add("oculto");
  } catch (_) {
    $("desconectado").classList.remove("oculto");
  }
  setTimeout(refrescar, 2000);
}

// --------------------------------------------------------- ajustes equipo
["inEquipo", "inApSsid", "inApClave", "inPais", "inClavePanel", "ipDir", "ipPref", "ipGw", "ipDns"].forEach((id) =>
  $(id).addEventListener("input", () => editado.add(id)));
$("segTransp").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { elegido.transporte = b.dataset.v; pintar(ultimo); }));
$("segIp").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { elegido.ip_metodo = b.dataset.v; pintar(ultimo); }));

async function guardar(boton, msg, datos, campos) {
  boton.disabled = true;
  try {
    const r = await api("/api/config", datos);
    campos.forEach((c) => editado.delete(c));
    delete elegido.transporte;
    mensaje(msg, r.reinicio ? t("saved_restart") : t("saved_simple"), "ok");
  } catch (err) { mensaje(msg, err.message, "mal"); }
  boton.disabled = false;
  setTimeout(() => mensaje(msg), 7000);
}
$("btGuardarEquipo").addEventListener("click", () => {
  const datos = {};
  if (editado.has("inEquipo")) datos.nombre_equipo = $("inEquipo").value.trim();
  if (elegido.transporte) datos.transporte = elegido.transporte;
  if (editado.has("inApSsid")) datos.ap_ssid = $("inApSsid").value.trim();
  if (editado.has("inApClave")) datos.ap_clave = $("inApClave").value;
  if (editado.has("inPais")) datos.pais = $("inPais").value.trim();
  if (editado.has("inClavePanel") && $("inClavePanel").value.trim()) datos.clave_panel = $("inClavePanel").value.trim();
  $("inClavePanel").value = "";
  guardar($("btGuardarEquipo"), "msgEquipo", datos, ["inEquipo", "inApSsid", "inApClave", "inPais", "inClavePanel"]);
});
$("btQuitarClave").addEventListener("click", () =>
  guardar($("btQuitarClave"), "msgEquipo", { clave_panel: "" }, ["inClavePanel"]));

// -------------------------------------------------------------------- HDMI
async function guardarHdmi(datos) {
  try { await api("/api/config", datos); } catch (err) { mensaje("msgHdmi", err.message, "mal"); }
}
$("hdmiActiva").addEventListener("change", () => guardarHdmi({ hdmi: $("hdmiActiva").checked }));
$("hdmiFuente").addEventListener("change", () => guardarHdmi({ hdmi_fuente: $("hdmiFuente").value }));
$("hdmiConsola").addEventListener("change", () => guardarHdmi({ hdmi_consola: $("hdmiConsola").value }));
$("btHdmiReboot").addEventListener("click", async () => {
  if (!confirm(t("confirm_reboot"))) return;
  await api("/api/sistema/reiniciar", {}).catch(() => {});
});

// ---------------------------------------------------------------------- IP
$("btIp").addEventListener("click", async () => {
  const metodo = elegido.ip_metodo || (ultimo && ultimo.red.ip && ultimo.red.ip.metodo) || "auto";
  const datos = { metodo };
  if (metodo === "manual") {
    Object.assign(datos, { direccion: $("ipDir").value.trim(), prefijo: Number($("ipPref").value || 24),
      gateway: $("ipGw").value.trim(), dns: $("ipDns").value });
    if (!confirm(T[lang].confirm_ip_manual(datos.direccion))) return;
  } else if (!confirm(t("confirm_ip_auto"))) return;
  try {
    await api("/api/red/ip", datos);
    ["ipDir", "ipPref", "ipGw", "ipDns"].forEach((x) => editado.delete(x)); delete elegido.ip_metodo;
    mensaje("msgIp", t("ip_applying"), "info");
    clearInterval(sondeoIp);
    sondeoIp = setInterval(async () => {
      try {
        const ip = (await api("/api/estado")).red.ip, c = ip && ip.cambio;
        if (!c || c.estado === "aplicando") return;
        clearInterval(sondeoIp);
        mensaje("msgIp", c.estado === "ok" ? T[lang].ip_ok(c) : (T[lang].ip_errors[c.motivo] || c.motivo), c.estado === "ok" ? "ok" : "mal");
      } catch (_) { /* el equipo puede estar cambiando de dirección */ }
    }, 2000);
  } catch (err) { mensaje("msgIp", err.message, "mal"); }
});

// ----------------------------------------------------------- actualización
$("btComprobar").addEventListener("click", async () => {
  $("btComprobar").disabled = true; poner("btComprobar", t("checking"));
  try {
    const a = await api("/api/actualizacion?comprobar=1");
    if (a.error) mensaje("msgAct", T[lang].update_errors[a.error] || a.error, "mal");
    else mensaje("msgAct", a.disponible ? "" : t("up_to_date"), "ok");
    if (ultimo) { ultimo.actualizacion = a; pintar(ultimo); }
  } catch (err) { mensaje("msgAct", err.message, "mal"); }
  $("btComprobar").disabled = false; poner("btComprobar", t("check_updates"));
  setTimeout(() => { if (!(ultimo && ultimo.actualizacion.en_curso)) mensaje("msgAct"); }, 8000);
});
$("btActualizar").addEventListener("click", async () => {
  try { await api("/api/actualizacion/instalar", {}); mensaje("msgAct", t("updating"), "info"); }
  catch (err) { mensaje("msgAct", err.message, "mal"); }
});

// ------------------------------------------------------------------ WiFi
function itemGuardada(g) {
  return el("li", null,
    el("span", { class: "nombre", text: g.ssid }),
    el("span", { class: "meta", text: g.activa ? t("connected") : "" }),
    el("button", { class: "boton peligro", text: t("forget"), onclick: async () => {
      if (!confirm(T[lang].confirm_forget(g.ssid, g.activa))) return;
      try { await api("/api/wifi/olvidar", { id: g.id, ssid: g.ssid }); cargarWifi(false); }
      catch (err) { mensaje("msgWifi", err.message, "mal"); }
    } }));
}
function itemVista(r) {
  const clave = el("input", { type: "password", placeholder: t("password"), autocomplete: "off" });
  if (!r.seguridad) clave.classList.add("oculto");
  const form = el("form", { class: "formulario-red oculto", onsubmit: async (ev) => {
    ev.preventDefault();
    if (ultimo && ultimo.red.modo === "wifi" && !ultimo.desde_ap && !confirm(T[lang].confirm_connect(r.ssid))) return;
    try {
      await api("/api/wifi/conectar", { ssid: r.ssid, clave: clave.value });
      mensaje("msgWifi", T[lang].connecting(r.ssid), "info");
      seguirConexion();
    } catch (err) { mensaje("msgWifi", err.message, "mal"); }
  } }, clave, el("button", { class: "boton principal", text: t("connect") }));
  const fila = el("button", { class: "red-boton", onclick: () => { form.classList.toggle("oculto"); clave.focus(); } },
    senalSvg(r.senal), el("span", { class: "nombre", text: r.ssid }),
    el("span", { class: "meta", text: `${banda(r.banda)} · ${r.seguridad || t("open")}${r.activa ? " · " + t("in_use") : ""}` }));
  return el("li", { style: "flex-direction:column;align-items:stretch" }, fila, form);
}
async function cargarWifi(buscar) {
  if (buscar) { $("btBuscar").disabled = true; poner("btBuscar", t("scanning")); }
  try {
    const d = await api("/api/wifi/redes" + (buscar ? "?buscar=1" : ""));
    const g = $("wifiGuardadas"); g.replaceChildren();
    if (!d.guardadas.length) vacio(g, t("none_f"));
    d.guardadas.forEach((x) => g.appendChild(itemGuardada(x)));
    if (buscar || !$("wifiVistas").classList.contains("oculto")) {
      const v = $("wifiVistas"); v.replaceChildren(); v.classList.remove("oculto");
      if (!d.redes.length) vacio(v, t("no_networks"));
      d.redes.forEach((x) => v.appendChild(itemVista(x)));
    }
    const exclusivo = ultimo && ultimo.red.ap && ultimo.red.ap.activo && ultimo.red.ap.modo === "exclusivo";
    $("ayudaCache").classList.toggle("oculto", !exclusivo);
  } catch (err) { mensaje("msgWifi", err.message, "mal"); }
  $("btBuscar").disabled = false; poner("btBuscar", t("scan"));
}
function seguirConexion() {
  clearInterval(sondeoWifi);
  sondeoWifi = setInterval(async () => {
    try {
      const c = (await api("/api/estado")).conexion_wifi;
      if (!c || c.estado === "conectando") return;
      clearInterval(sondeoWifi);
      mensaje("msgWifi", c.estado === "ok" ? T[lang].wifi_ok(c) : (T[lang].wifi_reasons[c.motivo] || c.motivo),
        c.estado === "ok" ? "ok" : "mal");
      cargarWifi(false);
    } catch (_) { /* el equipo puede estar cambiando de red */ }
  }, 1500);
}
$("btBuscar").addEventListener("click", () => cargarWifi(true));

// --------------------------------------------------------------- respaldo
$("btRestaurar").addEventListener("click", () => $("archivoRespaldo").click());
$("archivoRespaldo").addEventListener("change", async () => {
  const f = $("archivoRespaldo").files[0]; $("archivoRespaldo").value = "";
  if (!f) return;
  let d;
  try { d = JSON.parse(await f.text()); } catch (_) { return mensaje("msgRespaldo", t("bad_backup"), "mal"); }
  if (!d || typeof d !== "object" || !("config" in d)) return mensaje("msgRespaldo", t("bad_backup"), "mal");
  if (!confirm(T[lang].confirm_restore(d.fecha || "?"))) return;
  try { await api("/api/respaldo", d); mensaje("msgRespaldo", t("restoring"), "info"); }
  catch (err) { mensaje("msgRespaldo", err.message, "mal"); }
});
$("btFabrica").addEventListener("click", async () => {
  const r = prompt(t("confirm_factory"));
  if (r !== "FABRICA") return;
  try { await api("/api/fabrica", { confirmar: "FABRICA" }); mensaje("msgRespaldo", t("factory_done"), "info"); }
  catch (err) { mensaje("msgRespaldo", err.message, "mal"); }
});

// ---------------------------------------------------------------- equipo
$("btAp").addEventListener("click", async () => {
  const activar = $("btAp").dataset.activar === "1";
  if (activar && !confirm(t("confirm_ap"))) return;
  try { await api("/api/ap", { activar }); } catch (err) { mensaje("msgEquipo", err.message, "mal"); }
});
$("btReboot").addEventListener("click", async () => {
  if (!confirm(t("confirm_reboot"))) return;
  await api("/api/sistema/reiniciar", {}).catch(() => {});
});

aplicarIdioma();
refrescar();
</script>
</body>
</html>
